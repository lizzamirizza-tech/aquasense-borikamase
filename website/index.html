<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AquaSense — real-time IoT water quality monitoring (pH, TDS, turbidity) with Kalman Filter processing in Node-RED. Desa Borikamase, Maros Baru." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>AquaSense Borikamase</title>
    <!-- Apply the saved theme before first paint (no flash); see src/context/ThemeContext.jsx -->
    <script>
      try {
        if (localStorage.getItem("aquasense.theme") === "light") document.documentElement.dataset.theme = "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
